<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#EDEFEA">
<title>NavLife — маршрут, питание и тренировка мозга</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Styles: база → скин -->
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="premium-skin.css">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NavLife">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="format-detection" content="telephone=no">
</head>
<body>

<div id="app">
  <main id="screens"></main>
  <nav id="nav" class="nav hidden">
    <button class="nav-btn" data-nav="today"><span class="ni">🏠</span><span class="nl">Сегодня</span></button>
    <button class="nav-btn" data-nav="schedule"><span class="ni">📅</span><span class="nl">Дела</span></button>
    <button class="nav-btn" data-nav="nutrition"><span class="ni">🥗</span><span class="nl">Питание</span></button>
    <button class="nav-btn" data-nav="brain"><span class="ni">🧠</span><span class="nl">Мозг</span></button>
    <button class="nav-btn" data-nav="stats"><span class="ni">📊</span><span class="nl">Прогресс</span></button>
    <button class="nav-btn" data-nav="profile"><span class="ni">👤</span><span class="nl">Профиль</span></button>
  </nav>
</div>

<div id="modal-root" class="modal-root"></div>
<div id="flash" class="flash"></div>
<div id="toast" class="toast"></div>

<!-- Скрипты: логика → фичи -->
<script src="app.js"></script>
<script src="feature-pack.js"></script>

</body>
</html>
